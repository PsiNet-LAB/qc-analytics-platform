<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Plataforma Analítica QC — Panel centralizado de supervisión y gestión de calidad operativa.">
    <title>Plataforma Analítica QC</title>

    <!-- Legacy-browser support: polyfills and feature flags -->
    <script src="browser-support.js" defer></script>

    <style>
        /* ============================================================
           BASE RESET
           ============================================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ============================================================
           LAYOUT — flex column by default (IE 10+ safe)
           ============================================================ */
        html, body {
            height: 100%;
        }

        body {
            display: -ms-flexbox;   /* IE 10 */
            display: flex;
            -ms-flex-direction: column;
            flex-direction: column;
            background-color: #F5F7FA;
            color: #1A2332;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }

        main {
            -ms-flex: 1 1 auto;
            flex: 1 1 auto;
            position: relative;
            min-height: 0; /* allow flex child to shrink */
        }

        /* ============================================================
           PROGRESSIVE ENHANCEMENT — CSS Grid (modern browsers)
           ============================================================ */
        @supports (display: grid) {
            body {
                display: grid;
                grid-template-rows: auto 1fr;
                height: 100vh;
            }

            main {
                display: grid;
                grid-template-rows: 1fr;
            }
        }

        /* ============================================================
           PROGRESSIVE ENHANCEMENT — backdrop-filter
           Browsers without support fall back to solid background.
           ============================================================ */
        .loading-overlay {
            background-color: rgba(245, 247, 250, 0.95); /* solid fallback */
        }

        @supports (backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px)) {
            .loading-overlay {
                background-color: rgba(245, 247, 250, 0.75);
                -webkit-backdrop-filter: blur(4px);
                backdrop-filter: blur(4px);
            }
        }

        /* ============================================================
           PROGRESSIVE ENHANCEMENT — CSS animation
           ============================================================ */
        @supports (animation: spin 0.8s linear infinite) {
            .loading-spinner {
                animation: spin 0.8s linear infinite;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        }

        /* ============================================================
           ACCESSIBILITY — skip-navigation link
           Visible only on keyboard focus.
           ============================================================ */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            z-index: 1000;
            padding: 8px 16px;
            background: #0969DA;
            color: #ffffff;
            font-size: 14px;
            text-decoration: none;
            border-radius: 0 0 4px 0;
            transition: top 0.2s ease;
        }

        .skip-link:focus {
            top: 0;
            outline: 3px solid #ffffff;
            outline-offset: 2px;
        }

        /* ============================================================
           IFRAME
           ============================================================ */
        .app-frame {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ============================================================
           LOADING OVERLAY
           ============================================================ */
        .loading-overlay {
            position: fixed;
            inset: 0;
            display: -ms-flexbox;
            display: flex;
            -ms-flex-direction: column;
            flex-direction: column;
            -ms-flex-align: center;
            align-items: center;
            -ms-flex-pack: center;
            justify-content: center;
            z-index: 500;
            transition: opacity 0.4s ease;
        }

        .loading-overlay[hidden] {
            display: none;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #D0D7DE;
            border-top-color: #0969DA;
            border-radius: 50%;
        }

        .loading-text {
            margin-top: 12px;
            color: #5A6978;
            font-size: 14px;
        }

        /* ============================================================
           NOSCRIPT BANNER
           ============================================================ */
        .noscript-banner {
            background-color: #FDE093;
            color: #1A2332;
            padding: 12px 20px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <!-- Accessibility: skip-to-main link for keyboard and screen-reader users -->
    <a class="skip-link" href="#main-content">Ir al contenido principal</a>

    <!-- Inform users whose browser has JavaScript disabled -->
    <noscript>
        <p class="noscript-banner" role="alert">
            JavaScript está desactivado. Algunas funciones de compatibilidad pueden no estar disponibles.
            Para la mejor experiencia, por favor habilite JavaScript en su navegador.
        </p>
    </noscript>

    <!-- Page header — reserved for future navigation or branding elements -->
    <header role="banner" aria-label="Encabezado de la plataforma"></header>

    <!-- ============================================================
         MAIN APPLICATION CONTENT
         ============================================================ -->
    <main id="main-content" role="main" aria-label="Plataforma Analítica QC">

        <!-- Loading overlay displayed while the embedded app initialises -->
        <div
            class="loading-overlay"
            id="loadingOverlay"
            role="status"
            aria-live="polite"
            aria-label="Cargando aplicación"
        >
            <div class="loading-spinner" aria-hidden="true"></div>
            <p class="loading-text">Cargando plataforma…</p>
        </div>

        <iframe
            id="appFrame"
            class="app-frame"
            src="https://su-enlace-actual.streamlit.app/?embed=true"
            title="Plataforma Analítica QC — Panel de supervisión y gestión de calidad operativa"
            aria-label="Plataforma Analítica QC"
            loading="lazy"
            allowfullscreen
        ></iframe>

    </main>

    <script>
        (function () {
            var frame   = document.getElementById('appFrame');
            var overlay = document.getElementById('loadingOverlay');
            if (!frame || !overlay) { return; }

            frame.addEventListener('load', function () {
                overlay.setAttribute('hidden', '');
            });

            // Fallback: hide overlay after 15 s if the load event never fires
            setTimeout(function () {
                overlay.setAttribute('hidden', '');
            }, 15000);
        }());
    </script>

</body>
</html>
